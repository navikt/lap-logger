apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: lap-logger
  namespace: fagtorsdag
spec:
  image: {{image}}
  port: 8080
  ingresses:
    - https://backyard.ansatt.nav.no
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 50
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
  envFrom:
    - secret: backyard-supabase
  accessPolicy:
    outbound:
      external:
        - host: "https://feevuyuxjcrspsapihkm.supabase.co"
